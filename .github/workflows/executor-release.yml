# Builds the Executor fork of workerd for Linux (x64 and arm64) and publishes the binaries as a
# GitHub release on this fork, with SHA-256 checksums.
#
# This fork does not have access to Cloudflare's remote Bazel cache or larger runners, so the
# build runs on standard GitHub-hosted runners (4 vCPU) and relies on the GitHub Actions cache
# for Bazel's disk cache. The cache is saved even when the build step times out, so a cold build
# that does not fit in one job makes progress and a re-run picks up where it stopped.
name: Executor workerd release

on:
  push:
    branches:
      - 'executor/**'
    paths-ignore:
      - 'EXECUTOR.md'
  workflow_dispatch:
    inputs:
      from_run:
        description: 'Publish the binaries of this earlier run instead of building (run ID)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: executor-release-${{ github.ref }}-${{ inputs.from_run }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 matches upstream release builds (glibc 2.35).
          - arch: linux-64
            image: ubuntu-22.04
          - arch: linux-arm64
            image: ubuntu-22.04-arm
    name: build (${{ matrix.arch }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.from_run == '' }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune --all --force || true
          df -h /
      # Computed once, before Setup Runner appends toolchain paths to .bazelrc, so that the key
      # used to save the cache matches the one used to restore it.
      - name: Cache key
        id: cache-key
        run: echo "prefix=executor-bazel-${{ matrix.arch }}-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'build/deps/gen/*.bzl', 'build/deps/gen/*.bazel') }}-" >> "$GITHUB_OUTPUT"
      - name: Restore Bazel disk cache
        uses: actions/cache/restore@v5
        with:
          path: ~/bazel-disk-cache
          key: ${{ steps.cache-key.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}
      - name: Setup Runner
        uses: ./.github/actions/setup-runner
        with:
          GOOGLESOURCE_COOKIE: ''
      - name: Bazel build
        id: build
        timeout-minutes: 320
        run: |
          # The disk cleanup removes the Android SDK the x64 image points ANDROID_HOME at;
          # rules_android fails to fetch when that variable names a missing SDK.
          env -u ANDROID_HOME -u ANDROID_SDK_ROOT -u ANDROID_NDK_HOME -u ANDROID_NDK_ROOT \
          bazel build --config=ci --config=ci-linux-common --config=release_linux --strip=always \
            --local_resources=memory=HOST_RAM*.8 \
            //src/workerd/server:workerd
      - name: Smoke test
        if: steps.build.outcome == 'success'
        run: |
          cp bazel-bin/src/workerd/server/workerd /tmp/workerd
          /tmp/workerd --version
          bash .github/executor/smoke-test.sh /tmp/workerd
      - name: Upload binary
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: workerd-${{ matrix.arch }}
          path: /tmp/workerd
          if-no-files-found: error
      - name: Trim Bazel disk cache
        if: always()
        run: |
          if [ -d ~/bazel-disk-cache ]; then
            find ~/bazel-disk-cache -size +100M -type f -delete
            du -ms ~/bazel-disk-cache
          fi
          bazel shutdown || true
      - name: Save Bazel disk cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ~/bazel-disk-cache
          key: ${{ steps.cache-key.outputs.prefix }}${{ github.sha }}

  release:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.from_run != '')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the built commit
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.from_run }}" ]; then
            echo "run=${{ inputs.from_run }}" >> "$GITHUB_OUTPUT"
            echo "sha=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.from_run }} --jq .head_sha)" >> "$GITHUB_OUTPUT"
          else
            echo "run=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/artifacts
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Package
        id: package
        env:
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          base="v1.$(tr -d '-' < src/workerd/io/release-version.txt).1"
          tag="${base}-executor.${SHA:0:10}"
          mkdir -p /tmp/release
          for arch in linux-64 linux-arm64; do
            install -m 755 /tmp/artifacts/workerd-$arch/workerd /tmp/release/workerd-$arch
            gzip -9n -c /tmp/release/workerd-$arch > /tmp/release/workerd-$arch.gz
          done
          cd /tmp/release
          sha256sum workerd-linux-64 workerd-linux-arm64 workerd-linux-64.gz workerd-linux-arm64.gz > SHA256SUMS
          cat SHA256SUMS
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # Keep the exact release files even if publishing fails.
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: /tmp/release/
      # Workflow tokens in UsefulSoftwareCo default to read-only, and some runs have been refused
      # release creation. If that happens, create the release from the release-files artifact.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.source.outputs.sha }}
          tag: ${{ steps.package.outputs.tag }}
        run: |
          set -euo pipefail
          cd /tmp/release
          base="${tag%%-executor.*}"
          notes="Executor build of workerd ${base}, built from ${SHA} on ${GITHUB_REF_NAME}. See EXECUTOR.md on that commit for the patches applied on top of upstream ${base}."
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" -R "$GITHUB_REPOSITORY" workerd-linux-64.gz workerd-linux-arm64.gz SHA256SUMS --clobber
          else
            gh release create "$tag" -R "$GITHUB_REPOSITORY" workerd-linux-64.gz workerd-linux-arm64.gz SHA256SUMS \
              --target "$SHA" --title "$tag" --notes "$notes"
          fi
